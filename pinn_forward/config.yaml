# ── 物理参数 ────────────────────────────────────────────────
physics:
  v_0: !!float 10e-6                  # Loading velocity [m/s]
  k: !!float 14.8e9                   # Spring stiffness [Pa/m]
  beta_1: 1.2                 # b₁/a₀ [non-dim]
  L_1: !!float 3e-6                   # Critical distance for θ₁ [m]
  rho: 0.1
  a: 0.01                     # Friction direct effect [non-dim]
  mu_0: 0.64                  # Static friction coefficient [non-dim]
  G: !!float 31e9                     # Rigidity modulus of quartz [Pa]
  rho_v: !!float 2.65e3               # Density of quartz [kg/m^3]
  p_0: !!float 1.01325e5              # Reference pressure [Pa]
  beta_a: !!float 1e-9
  beta_m: !!float 1e-11
  phi_0: 0.075
  epsilon: !!float -0.017e-3          # dilatancy/compressibility
  c_0: 10                     # Diffusivity [1/s]

# ── 训练相关 ────────────────────────────────────────────────
training:
  device: "mps"               # 可选: cuda, mps, cpu
  time:
    start: 0.0
    end: 6.0
    step: 0.1

  model:
    input_size: 1
    hidden_size: 200
    output_size: 4
    depth: 4
    activation: "Tanh"

  optimizer:
    adam:
      lr: 0.00001
      steps: 40000

    lbfgs:
      lr: 0.001
      max_iter: 400000
      max_eval: 400000
      history_size: 50
      tolerance_grad: !!float 1.0e-15
      tolerance_change: !!float 1.0e-15
      line_search_fn: "strong_wolfe"

  loss:
    boundary_weight: 0.6
    residual_clamp_min: 1.0
    residual_clamp_max: 10.0

  logging:
    print_every: 50
    save_best_model: true
    best_model_path: "best_model.pth"
    loss_plot_path: "loss_plot.pdf"


evaluate:
  time:
    start: 0.0
    end: 6.0
    step: 0.01

  logging:
    y_plot_path: "y_plot.pdf"
    results_path: "result.txt"